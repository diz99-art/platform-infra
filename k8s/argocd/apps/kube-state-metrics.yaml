# kube-state-metrics: 쿠버네티스 객체의 상태(파드 재시작 수, 노드 Ready, Deployment 가용 수)를 지표로 만든다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics
  namespace: platform
spec:
  project: platform
  source:
    # OCI 레지스트리 (차트 목록 전체를 받지 않는다. 저장소 등록은 ansible/roles/argocd)
    repoURL: ghcr.io/prometheus-community/charts
    chart: kube-state-metrics
    targetRevision: 8.6.0
    helm:
      valuesObject:
        fullnameOverride: kube-state-metrics
        # 필요한 객체만 본다. secrets·configmaps를 빼서 Secret 목록을 읽는 권한 자체가 없게 한다 (최소 권한)
        collectors: [nodes, pods, deployments, statefulsets, daemonsets, replicasets, jobs, cronjobs, persistentvolumeclaims, persistentvolumes, namespaces]
        prometheusScrape: true      # Service에 prometheus.io/scrape 어노테이션
        resources:
          requests: { cpu: 10m, memory: 24Mi }
          limits: { memory: 64Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated: { prune: true, selfHeal: true }
