# 모니터링 본체 (VictoriaMetrics, vmalert, Alertmanager, exporter, 대시보드 ConfigMap, Ingress)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: platform
spec:
  project: platform
  source:
    repoURL: https://github.com/diz99-art/platform-infra.git
    targetRevision: main
    path: k8s/platform/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated: { prune: true, selfHeal: true }
