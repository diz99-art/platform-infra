# Grafana: 대시보드 화면. 데이터는 VictoriaMetrics, 대시보드는 Git의 JSON(ConfigMap grafana-dashboards)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: platform
spec:
  project: platform
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 14.0.1
    helm:
      valuesObject:
        fullnameOverride: grafana
        # 관리자 계정은 Ansible이 vault로 만든 Secret에서 (차트가 Secret을 만들지 않게)
        admin:
          existingSecret: grafana-admin
        # 대시보드·데이터 소스를 전부 파일로 넣으므로 저장할 상태가 없다 (재시작하면 로그인 세션만 사라짐)
        persistence: { enabled: false }
        testFramework: { enabled: false }
        # 192Mi로 시작했다가 OOMKilled: 처음 뜰 때 내장 DB(SQLite) 초기화(migration)에 메모리를 많이 쓴다
        resources:
          requests: { cpu: 20m, memory: 128Mi }
          limits: { memory: 320Mi }
        grafana.ini:
          server:
            root_url: "%(protocol)s://%(domain)s/grafana/"
            serve_from_sub_path: true
          # 보기 전용은 로그인 없이 (맥 안 사설망 학습용. 수정은 admin 로그인 필요)
          auth.anonymous:
            enabled: true
            org_role: Viewer
          analytics: { reporting_enabled: false, check_for_updates: false, check_for_plugin_updates: false }
          news: { news_feed_enabled: false }
          # 알림은 vmalert + Alertmanager가 한다. Grafana 자체 알림 엔진(규칙 평가·상태 저장)은 끈다
          unified_alerting: { enabled: false }
          # Grafana 12+는 시작할 때 기본 플러그인 몇 개를 인터넷에서 받아 설치한다. 쓰지 않으므로 끈다 (시작 메모리·시간 절약)
          plugins: { preinstall_disabled: true }
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: VictoriaMetrics
                uid: vm
                type: prometheus           # VictoriaMetrics는 Prometheus API와 호환된다
                url: http://victoria-metrics.platform.svc:8428
                access: proxy
                isDefault: true
        # 대시보드 sidecar(ConfigMap을 찾아다니는 보조 컨테이너, 약 50~80MB)를 쓰지 않고 ConfigMap을 바로 마운트한다
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: platform
                folder: Platform
                type: file
                disableDeletion: true
                allowUiUpdates: false      # 화면에서 고쳐도 저장되지 않는다. 고치려면 Git의 JSON을 고친다
                updateIntervalSeconds: 30
                options:
                  path: /var/lib/grafana/dashboards/platform
        dashboardsConfigMaps:
          platform: grafana-dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated: { prune: true, selfHeal: true }
