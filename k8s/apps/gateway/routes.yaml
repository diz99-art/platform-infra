# 경로 정리: 어느 주소가 어느 서비스로 가는지 한곳에서 본다. 여기 없는 주소는 Traefik이 404 (앱까지 가지 않는다)
#   /auth, /auth/...                 → 인증 서버
#   /coupons, /coupons/...           → 쿠폰 서버
#   /users/me/coupons, /users/{id}/coupons → 쿠폰 서버 (발급 내역)
#   /swagger-ui..., /v3/api-docs...  → 쿠폰 서버 Swagger (인증 서버 Swagger는 /auth/swagger-ui.html)
# priority: 숫자가 큰 규칙을 먼저 본다 (POST /auth/login이 /auth보다 먼저 맞아야 로그인 제한이 걸린다)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gateway
spec:
  entryPoints: [web]
  routes:
    - match: Method(`POST`) && Path(`/auth/login`)
      priority: 100
      middlewares: [{ name: request-id }, { name: security-headers }, { name: login-per-ip }, { name: body-limit }]
      services: [{ name: auth, port: http }]
    - match: Method(`POST`) && Path(`/auth/signup`)
      priority: 100
      middlewares: [{ name: request-id }, { name: security-headers }, { name: signup-per-ip }, { name: body-limit }]
      services: [{ name: auth, port: http }]
    # PathPrefix(`/auth`)만 쓰면 /authx 도 맞으므로 /auth 와 /auth/ 로 나눈다
    - match: Path(`/auth`) || PathPrefix(`/auth/`)
      priority: 50
      middlewares: [{ name: request-id }, { name: security-headers }, { name: auth-per-ip }, { name: body-limit }]
      services: [{ name: auth, port: http }]
    - match: Method(`POST`) && PathRegexp(`^/coupons/[0-9]+/issue$`)
      priority: 100
      middlewares: [{ name: request-id }, { name: security-headers }, { name: issue-per-token }, { name: body-limit }]
      services: [{ name: coupon, port: http }]
    - match: Path(`/coupons`) || PathPrefix(`/coupons/`) || PathRegexp(`^/users/(me|[0-9]+)/coupons$`)
      priority: 50
      middlewares: [{ name: request-id }, { name: security-headers }, { name: body-limit }]
      services: [{ name: coupon, port: http }]
    - match: Path(`/swagger-ui.html`) || PathPrefix(`/swagger-ui/`) || PathPrefix(`/v3/api-docs`)
      priority: 50
      middlewares: [{ name: request-id }, { name: security-headers }]
      services: [{ name: coupon, port: http }]
