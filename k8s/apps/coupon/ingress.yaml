# 맥 브라우저 → 노드 IP:80 → Traefik → coupon:80
# 지금은 쿠폰 서버가 유일한 앱이라 / 전체를 받는다. Gateway가 생기면 Gateway가 / 를 받고 쿠폰은 Gateway 뒤로 들어간다
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coupon
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coupon
                port:
                  name: http
