# 쿠폰 서버 매니페스트 (Kustomize). ArgoCD가 이 폴더를 `kustomize build`해서 apps 네임스페이스에 적용한다.
# 직접 보기: kubectl kustomize k8s/apps/coupon
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - ingress.yaml

# 설정(ConfigMap)을 config.env 파일에서 만든다. 이름 뒤에 내용의 해시가 붙어(coupon-config-abc123)
# 설정을 바꾸면 Deployment가 가리키는 이름도 바뀌어 파드가 새 설정으로 다시 뜬다
configMapGenerator:
  - name: coupon-config
    envs:
      - config.env

# 이미지 태그 = coupon-system의 커밋 해시. coupon-system의 GitHub Actions가 이 줄을 바꿔 push한다 (사람이 고치지 않는다)
images:
  - name: ghcr.io/diz99-art/coupon-system
    newTag: 8c5905788c538e4436da186c2d65d7baf5a7612e
