# 맥 브라우저 → 노드 IP:80/auth → Traefik → auth:80 (인증 서버는 context-path /auth 아래에 모든 주소가 있다)
# 쿠폰 서버 Ingress의 / 보다 /auth 가 더 길어서 먼저 맞는다
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  name: http
