# 플레이북이 쓰는 Ansible 컬렉션. brew로 ansible을 설치했다면 이미 들어 있다.
# 다른 방법으로 설치한 경우: ansible-galaxy collection install -r requirements.yml
collections:
  - name: community.general   # timezone, modprobe
  - name: ansible.posix       # sysctl
  - name: kubernetes.core     # k8s, k8s_info (맥에서 클러스터에 적용, 파이썬 kubernetes 라이브러리 필요)
  - name: ansible.mysql       # mysql_db, mysql_user (cp1에 python3-pymysql 필요)
