# ansible 디렉터리 안에서 명령을 실행하면 이 설정이 자동으로 적용된다.
[defaults]
inventory = inventory.ini
# VM 안의 파이썬을 자동으로 찾고, 그 과정의 경고는 숨긴다
interpreter_python = auto_silent
# 결과를 사람이 읽기 쉬운 YAML 형태로 출력
stdout_callback = default
callback_result_format = yaml
# 쓸데없는 .retry 파일 만들지 않기
retry_files_enabled = false

[ssh_connection]
# 모듈 파일을 VM에 복사하지 않고 ssh로 바로 흘려보내 실행 → 작업마다 ssh 왕복이 줄어 빠르다
pipelining = true
