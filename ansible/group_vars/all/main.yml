# 모든 서버에 공통으로 쓰는 변수. 롤 안의 defaults/main.yml보다 우선한다.

# k3s 버전 고정. 바꾸면 다음 실행 때 그 버전으로 설치(업그레이드)된다.
# 확인: curl -s https://update.k3s.io/v1-release/channels (stable 채널)
k3s_version: v1.36.5+k3s1

# 컨트롤 플레인 주소. 인벤토리의 control_plane 그룹 첫 서버(cp1)의 IP를 "팩트"에서 꺼낸다.
# → IP를 어디에도 직접 적지 않는다. IP가 바뀌면 플레이북을 다시 실행하면 된다.
k3s_server_host: "{{ groups['control_plane'][0] }}"
k3s_server_ip: "{{ hostvars[k3s_server_host]['ansible_facts']['default_ipv4']['address'] }}"
k3s_api_port: 6443

# 맥에 저장할 kubeconfig (Docker Desktop 등 다른 클러스터 설정과 섞이지 않게 따로 둔다)
kubeconfig_local_path: "{{ lookup('env', 'HOME') }}/.kube/platform-infra.yaml"
kubeconfig_context: platform-infra

# ── 비밀 값 ──
# 실제 값은 같은 폴더의 vault.yml(암호화됨)에 vault_ 접두사로 있다.
# 여기서는 "어떤 비밀이 있는지"만 보이도록 이름을 연결한다 (grep으로 찾기 쉽게 하는 관례).
mysql_root_password: "{{ vault_mysql_root_password }}"
mysql_backup_password: "{{ vault_mysql_backup_password }}"
mysql_service_passwords: "{{ vault_mysql_service_passwords }}"
redis_password: "{{ vault_redis_password }}"
argocd_admin_password: "{{ vault_argocd_admin_password }}"
argocd_admin_password_bcrypt: "{{ vault_argocd_admin_password_bcrypt }}"
grafana_admin_password: "{{ vault_grafana_admin_password }}"
mysql_exporter_password: "{{ vault_mysql_exporter_password }}"
# 비어 있으면 알림을 보내지 않는다 (Alertmanager가 받기만 함). 넣는 법: scripts/set-vault-secret.sh vault_discord_webhook_url
discord_webhook_url: "{{ vault_discord_webhook_url }}"
