# [data 노드에서] PV가 가리킬 고정 경로를 만든다. local PV는 폴더를 만들어 주지 않는다.
- name: 데이터·백업 폴더 (주인 = 컨테이너의 mysql 사용자 {{ mysql_uid }})
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ mysql_uid }}"
    group: "{{ mysql_uid }}"
    mode: "0750"     # 주인(mysql)만 읽고 쓰기. 다른 사용자는 못 본다
  loop:
    - "{{ mysql_data_path }}"
    - "{{ mysql_backup_path }}"
