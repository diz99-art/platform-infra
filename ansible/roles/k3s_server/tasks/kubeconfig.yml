# cp1의 관리자 kubeconfig를 읽어 주소와 이름만 바꿔 맥에 저장한다.
# fetch 대신 slurp + copy를 쓰는 이유: fetch는 원본 그대로 받아오므로 주소를 고치면
# 다음 실행 때 "원본과 다르다"며 매번 다시 받는다(changed). copy는 고친 결과끼리 비교하므로 멱등하다.

- name: k3s.yaml 읽기
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig
  no_log: true

- name: 맥의 ~/.kube 디렉터리
  ansible.builtin.file:
    path: "{{ kubeconfig_local_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

# 127.0.0.1 → cp1 IP (맥에서 접속해야 하므로), 이름 default → platform-infra (다른 클러스터와 구분)
- name: 맥에 kubeconfig 저장
  ansible.builtin.copy:
    content: >-
      {{ k3s_kubeconfig.content | b64decode
         | replace('https://127.0.0.1:' ~ k3s_api_port, 'https://' ~ k3s_server_ip ~ ':' ~ k3s_api_port)
         | regex_replace('(?m)(name|cluster|user|current-context): default$', '\1: ' ~ kubeconfig_context) }}
    dest: "{{ kubeconfig_local_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
