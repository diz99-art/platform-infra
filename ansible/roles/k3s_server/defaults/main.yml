# k3s 서버(컨트롤 플레인) 기본값

# cp1에 앱 파드가 배치되지 않게 하는 taint.
# 쿠버네티스 표준 이름이라 CoreDNS·metrics-server 같은 k3s 기본 구성요소는 이 taint를 견디고(toleration) cp1에도 뜰 수 있다.
# 주의: k3s는 노드가 처음 등록될 때만 taint를 붙인다. 나중에 바꾸려면 kubectl taint로 직접 바꾼다.
k3s_server_taints:
  - node-role.kubernetes.io/control-plane:NoSchedule

# 끌 기본 구성요소 (traefik, servicelb, local-storage, metrics-server 중). 결정 이유는 docs/k3s-design.md
k3s_disable: []
