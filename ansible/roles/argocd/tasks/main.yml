# [맥에서] Helm으로 ArgoCD 설치, 화면 Ingress, AppProject, 루트 Application

- name: ArgoCD 네임스페이스
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ argocd_namespace }}"

- name: Argo Helm 저장소
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm

# 차트 버전을 고정한다. 값은 템플릿에서 만든다 (관리자 비밀번호 해시가 들어 있어 no_log)
- name: ArgoCD 설치·업그레이드 (Helm)
  kubernetes.core.helm:
    name: "{{ argocd_release }}"
    chart_ref: argo/argo-cd
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: "{{ argocd_namespace }}"
    values: "{{ lookup('template', 'values.yaml.j2') | from_yaml }}"
    wait: true
    wait_timeout: 10m
  no_log: true

- name: Ingress, AppProject, 루트 Application
  kubernetes.core.k8s:
    template: bootstrap.yaml.j2

# ArgoCD는 Helm 차트를 OCI 레지스트리에서 받으려면 저장소를 등록해야 한다 (enableOCI).
# 등록 정보는 Secret 형식이지만 비밀 값은 없다 (공개 레지스트리, 접속 정보 없음)
- name: OCI Helm 저장소 등록
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "repo-oci-{{ item.name }}"
        namespace: "{{ argocd_namespace }}"
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        name: "{{ (item.name ~ '-oci') | b64encode }}"
        type: "{{ 'helm' | b64encode }}"
        url: "{{ item.url | b64encode }}"
        enableOCI: "{{ 'true' | b64encode }}"
  loop: "{{ argocd_oci_helm_repos }}"
  loop_control: { label: "{{ item.url }}" }
