# 인벤토리: Ansible이 관리할 서버 목록과 그룹.
# IP 대신 ssh 별칭(cp1, worker1, worker2)을 쓴다. Ansible은 내부적으로 ssh를 쓰므로
# ~/.ssh/config.d/platform-infra의 주소·사용자·키 설정을 그대로 따른다.
# → VM IP가 바뀌어도 이 파일은 고칠 필요가 없다 (multipass/update-hosts.sh만 실행).

[control_plane]
cp1

[workers]
worker1
worker2

# 그룹의 그룹: k3s 클러스터 전체
[k3s_cluster:children]
control_plane
workers

# 상태(데이터)를 가진 구성요소를 둘 노드. local PV라 이 노드에 고정된다 (docs/memory-plan.md, docs/redis-kafka.md)
# MySQL: 저장 경로
[mysql]
worker1

# Redis + Kafka: 발급 경로 (발급 API는 이 둘만 있으면 응답한다)
[queue]
worker2

[data:children]
mysql
queue
